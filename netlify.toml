[build]
  command = "npm run build && mv build/index.html build/quiz.html"
  publish = "build"

[[redirects]]
  from = "/quiz"
  to = "/quiz.html"
  status = 200

# /pausar sirve una página HTML estática on-brand que en background hace POST
# al Apps Script con {type:"unsubscribe", token}. Sin proxy externo — no necesita
# plan Pro de Netlify y la URL queda limpia (tupmondemand.com/pausar).
[[redirects]]
  from = "/pausar"
  to = "/pausar.html"
  status = 200

[[redirects]]
  from = "/*"
  to = "/landing.html"
  status = 200
