[build]
  command = "npm run build && mv build/index.html build/quiz.html"
  publish = "build"

[[redirects]]
  from = "/quiz"
  to = "/quiz.html"
  status = 200

# /pausar sirve una página HTML estática on-brand que en background hace POST
# al Apps Script con {type:"unsubscribe", token}. Sin proxy externo — no necesita
# plan Pro de Netlify y la URL queda limpia (tupmondemand.com/pausar).
[[redirects]]
  from = "/pausar"
  to = "/pausar.html"
  status = 200

# /wa: registra el click + redirige a wa.me con mensaje pre-armado.
# Lee code/profile/from de query params, hace POST al Apps Script con
# {type:"wa_click", code, from}, después redirige a wa.me/50766741296.
[[redirects]]
  from = "/wa"
  to = "/wa.html"
  status = 200

# Redirect 301 permanente del antiguo /teaser al quiz. Por si alguien
# tiene el link guardado de cuando era la URL del lead magnet aislado.
[[redirects]]
  from = "/teaser"
  to = "/quiz"
  status = 301

[[redirects]]
  from = "/*"
  to = "/landing.html"
  status = 200
