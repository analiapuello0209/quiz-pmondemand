<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Tomando el Control</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=DM+Serif+Text:ital@0;1&family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Rubik', sans-serif;
      background: #FAF7FD;
      color: #2D2944;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      background: #fff;
      max-width: 480px;
      width: 100%;
      padding: 48px 36px 36px;
      border-radius: 18px;
      text-align: center;
      box-shadow: 0 4px 24px rgba(28, 24, 53, 0.06);
      border: 1px solid #E8E2F0;
    }
    h1 {
      font-family: 'DM Serif Text', serif;
      font-weight: 400;
      font-size: 28px;
      line-height: 1.3;
      color: #2D2944;
      margin: 0 0 8px;
    }
    .accent {
      color: #815DFF;
      font-style: italic;
    }
    p {
      font-size: 15px;
      line-height: 1.6;
      color: #686087;
      margin: 16px 0 0;
    }
    .signature {
      margin-top: 30px;
      font-family: 'DM Serif Text', serif;
      font-style: italic;
      color: #815DFF;
      font-size: 18px;
    }
    .footer {
      font-size: 11px;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      color: #9E73AB;
      margin-top: 24px;
      padding-top: 18px;
      border-top: 1px solid #EFE8F1;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Listo, no recibirás más correos<br><span class="accent">de esta secuencia</span>.</h1>
    <p>Un abrazo.</p>
    <div class="signature">Analía</div>
    <div class="footer">PM On Demand</div>
  </div>
  <script>
    // Notificar al Apps Script en background (fire-and-forget, no-cors).
    // No esperamos respuesta — la página ya muestra confirmación al usuario.
    (function () {
      var token = new URLSearchParams(window.location.search).get('token');
      if (!token) return;
      try {
        fetch('https://script.google.com/macros/s/AKfycbxwEM5yy6EGHCP0nul_UAM18f_Ohg9MDOvXckxwuUqsaxhHFIsudwzbqCVy1GtUeSfj/exec', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ type: 'unsubscribe', token: token })
        });
      } catch (e) { /* silently fail */ }
    })();
  </script>
</body>
</html>
