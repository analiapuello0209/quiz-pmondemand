<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Abriendo WhatsApp...</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600&display=swap" rel="stylesheet">
  <style>
    * { box-sizing: border-box; }
    body {
      font-family: 'Rubik', sans-serif;
      background: #FAF7FD;
      color: #2D2944;
      margin: 0;
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }
    .card {
      text-align: center;
    }
    .spinner {
      width: 40px;
      height: 40px;
      margin: 0 auto 16px;
      border: 3px solid #EFE8F1;
      border-top-color: #815DFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
    .msg {
      color: #686087;
      font-size: 14px;
      margin: 0;
    }
  </style>
</head>
<body>
  <div class="card">
    <div class="spinner"></div>
    <p class="msg">Abriendo WhatsApp...</p>
  </div>
  <script>
    (function () {
      var params  = new URLSearchParams(window.location.search);
      var code    = params.get('code')    || '';
      var profile = params.get('profile') || '';
      var from    = params.get('from')    || '';

      // Construir mensaje pre-armado para WhatsApp (sin emojis ni acentos —
      // wa.me text rompe con caracteres especiales en algunos browsers).
      var msg = 'Hola Analia';
      if (profile) msg += ', sali ' + profile.replace(/\s+Eterno$/i, '');
      if (code)    msg += ' y quiero aplicar mi codigo ' + code;
      msg += ' para Tomando el Control.';

      // Registrar el click en Apps Script (fire-and-forget, no-cors)
      try {
        fetch('https://script.google.com/macros/s/AKfycbxwEM5yy6EGHCP0nul_UAM18f_Ohg9MDOvXckxwuUqsaxhHFIsudwzbqCVy1GtUeSfj/exec', {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'text/plain;charset=utf-8' },
          body: JSON.stringify({ type: 'wa_click', code: code, from: from })
        });
      } catch (e) { /* silently fail */ }

      // Redirigir a WhatsApp (delay mínimo para que el fetch arranque antes)
      setTimeout(function () {
        window.location.href = 'https://wa.me/50766741296?text=' + encodeURIComponent(msg);
      }, 150);
    })();
  </script>
</body>
</html>
